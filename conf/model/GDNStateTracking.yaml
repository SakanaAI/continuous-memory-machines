# @package _global_

# Grazzi et al. (ICLR 2025): extend beta to (0, 2) for negative eigenvalues.
# This GDN adaptation also applies decay before delta retrieval.
model:
  model: "GDNStateTracking"
  d_model: 256
  num_heads: 4
  expand_k: 0.75
  expand_v: 1.5
  conv_size: 4
  qk_norm: "l2"
  dropout: 0.0
