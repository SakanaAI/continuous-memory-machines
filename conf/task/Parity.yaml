# @package _global_

task:
    train_min_seq_length: 1
    train_max_seq_length: 40
    test_seq_lengths: [40, 50, 100, 200, 500, 1000]
    num_samples: 8192
    eval_num_samples: 2048

training:
    epochs: 200
    batch_size: 128
    learning_rate: 1e-3
    max_grad_norm: 5
    weight_decay: 0.0

evaluation:
    evaluation_interval: 10

model:
    d_input: 32
    backbone:
        type: linear
        mode: vector
        pretrained: false
        freeze: false
