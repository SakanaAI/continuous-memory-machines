[project]
name = "continuous-memory-machines"
version = "0.1.0"
description = "Continuous Memory Machines: recurrent models with short- and long-term matrix memories"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6.0,<2.7",
    "torchvision>=0.21.0,<0.22",
    "pillow",
    "timm",
    "einops",
    "numpy",
    "hydra-core>=1.3.2",
    "omegaconf",
    "wandb>=0.16.0",
    "datasets",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "tqdm",
    "hydra-submitit-launcher>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
exclude = ["*"]
